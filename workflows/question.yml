key: question
name: Question
start: look
fallback: true
ingest: >-
  He wants to know something and nothing built or changed: "why does the score
  reset?", "what model did the MVP use", "is it live yet", "how does the leaderboard
  work", "did you finish the dark mode?", "what's left on the spec?". Golem looks
  into it (the code, the site, its logs) and answers in a few minutes. Requests
  phrased as questions are not questions: "can you add a quiz mode?", "could you
  make it bigger?" are changes.
tabs:
  default:
    md: question.md
    blocks:
      - refresh
      - {stage: look, name: examine, does: answer, turns: 60, turn: none}
      - answer
      - end
