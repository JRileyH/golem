key: web_app
name: Web app
start: new
fallback: true
ingest: >-
  Something to build and host as a web project: an app, a game, a tool or a site
  with pages people open in a browser.
md: web_app.md
blocks:
  - setup
  - {stage: plan, name: spec, writes: spec, turns: 80, turn: none}
  - {stage: build, name: scaffold, builds: skeleton, turns: 200}
  - {use: ship}
  - {stage: build, name: mvp, builds: first-version, turns: 400}
  - {use: ship}
  - {checkin: checkin, optional: true, reply_to: buildout}
  - stage: design
    name: design
    makes: directions
    turns: 400
    optional: true
    turn: none
    skip_to: nothing
    nothing: ship-3
    extra: |-
      Riggy has tried the MVP; next, the project gets a look of its own. His reply
      to the check-in is for the buildout step, not this one: don't act on it here,
      but design for the project it describes.
  - {choose: choose, optional: true, more: design}
  - {stage: design, name: guide, makes: guide, turns: 200}
  - {stage: design, name: apply, makes: restyle, turns: 400}
  - {use: ship}
  - {stage: build, name: buildout, builds: rest, turns: 400}
  - {stage: review, turns: 150, optional: true, turn: none}
  - {stage: docs, message: now, turns: 80, optional: true, turn: none}
  - {use: ship}
  - end
