# Traefik behind something else (compose.http.yml): plain HTTP, no certificates; your
# proxy or, locally, nothing handles HTTPS. Otherwise the same as traefik/server.yml.
log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    asDefault: true
    # Keep the proxy's X-Forwarded-Proto (https) and -For, so sites see what visitors
    # used. Only the proxy should reach EDGE_PORT: docs/behind-a-proxy.md.
    forwardedHeaders:
      insecure: true
    http:
      aliasHeadersStrategy: delete
  internal:
    address: ":8080"
    asDefault: true
    http:
      aliasHeadersStrategy: delete
  ping:
    address: ":8082"
    http:
      aliasHeadersStrategy: delete

ping:
  entryPoint: ping

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
