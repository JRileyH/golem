# What of golem's old playbook text a built-in block may say differently, and why.
#
# tests/test_compose.py holds every built-in agent block to its playbook step's instructions
# (golden/playbooks.json): each sentence or list item of them must still be in what the block
# is told (the workflow's text and its own, composed: golem/golem/compose.py), word for word,
# unless it's listed here, by "<playbook>.<step>", under
#
#   carried: the start of the sentence, and the words in what it's told now that carry it (or
#            a map of mode to the words in that mode, for what the mode's tab says its own way)
#   dropped: the start of the sentence, and why it's let go
#
# `<playbook>.intro` is the playbook's text every step got: the words go in the workflow's
# intro, or (carried) in any of its blocks.
#
# And every file and skill it named (`docs/specs/mvp.md`, skills/review.md) must still be named.
# Rebuilding a built-in on stage blocks (they say things more generally) lists what moved here,
# for Riggy to read beside the composed diff.

carried:
  feature.intro:  # each tab's Build says its mode's bar, as its care
    "The project's mode sets the bar":
      reckless: "Keep tests light: the image build is the only required check."
      standard: "Add or update tests for the paths you touch"
      rigorous: "Test thoroughly: unit tests for the logic, and browser tests (Playwright) for the main and changed flows"
  feature.change:
    "For anything bigger than a small fix": "For anything bigger than a small fix, with no plan before this step, write a short mini-spec in `docs/specs/`"
    "Make the change, and add or update tests": "Add or update tests for the paths you touch, and keep all the project's tests passing"
    "Check the result in a real browser": "Check the result in a real browser as you go (skills/browser.md), at phone and desktop sizes"
  feature.review:
    "Review it with skills/review.md against": "Review it with skills/review.md against what it says to hold it to and `AGENTS.md` only"
  feature.second-pass:
    "A second review, of the first review's fixes": "A second review, of the last review's fixes (below): are they right, complete and tested, and did they break anything else?"
    "Fix what you find.": "Fix what you find, one commit per fix"
  options.intro:  # as in feature
    "The project's mode sets the bar":
      reckless: "Keep tests light: the image build is the only required check."
      standard: "Add or update tests for the paths you touch"
      rigorous: "Test thoroughly: unit tests for the logic, and browser tests (Playwright) for the main and changed flows"
  options.change:  # Build's `pick` part
    "Build what Riggy picked from the options the step before made.": "Build what Riggy picked from the options an earlier step made."
    "Add or update tests for the paths you touch, and check the result": "Check the result next to the option's screenshots."
  options.review:
    "Review it with skills/review.md against Riggy's pick": "Hold it to: Riggy's request (above); what he picked, with its files in `docs/options/` (under \"Done so far\"), and what he said about it"
  options.second-pass:
    "A second review, of the first review's fixes": "A second review, of the last review's fixes (below): are they right, complete and tested, and did they break anything else?"
    "Fix what you find.": "Fix what you find, one commit per fix"
  options.docs:
    "Update `README.md` and `AGENTS.md` if": "Update them where the work this step is about (below) made them wrong, and `docs/design.md` if it changed the look"
    "Add anything a future worker should know": "Retro: add anything a future worker on this project should know to `docs/lessons.md`."
    "Message: what changed, in Riggy's terms": "Message: what changed, in Riggy's terms (\"the quiz now shows the answer after each question\"), not the code's."
  design.design:  # the Design stage's directions
    "Make this round of the design pass": "Make a round of the project's design pass (skills/design.md): the doc, with directions for Riggy to pick from"
  design.guide:
    "Don't restyle the app yet": "Don't restyle the app yet."
  design.review:  # the look, in design's intro; the guide and the pick, in what it's held to
    "Review it with skills/review.md against `docs/design.md`": "A review in this job checks the look above all: every screen and state follows the guide, light and dark, on a phone and wide, and text passes contrast."
  design.second-pass:
    "A second review, of the first review's fixes": "A second review, of the last review's fixes (below): are they right, complete and tested, and did they break anything else?"
    "Fix what you find.": "Fix what you find, one commit per fix"
    "Then look at every screen once more": "every screen and state follows the guide, light and dark, on a phone and wide"
  design.docs:
    "Update `README.md` and `AGENTS.md` if the pass made them wrong.": "Update them where the work this step is about (below) made them wrong"
    "Add anything a future worker should know": "Retro: add anything a future worker on this project should know to `docs/lessons.md`."
    "Message: what changed, in Riggy's terms": "Message: what changed, in Riggy's terms (\"the quiz now shows the answer after each question\"), not the code's."
    "It's what he reads when golem tells him the pass is live.": "It's what he reads when golem tells him the change is live."
  feature.docs:
    "Update `README.md` and `AGENTS.md` if": "Update them where the work this step is about (below) made them wrong, and `docs/design.md` if it changed the look"
    "Add anything a future worker should know": "Retro: add anything a future worker on this project should know to `docs/lessons.md`."
  question.examine:  # no project conversation any more: he asks on its page
    "If the honest answer is": "say what you'd change; he can ask for it on the project's page."
  standard.mvp: &mvp  # Build's first-version part, then how it builds
    "Build the MVP from": "Build the first version, the MVP, from the plan (`docs/specs/mvp.md`), with tests for its core paths."
    "Build the MVP, with tests": "Build the first version, the MVP, from the plan (`docs/specs/mvp.md`), with tests for its core paths."
    "Riggy tries it on the live site next.": "Riggy tries it on the live site next: this is what he sees first."
    "Check it in a real browser as you go": "Check the result in a real browser as you go (skills/browser.md), at phone and desktop sizes"
    "Look at the screenshots.": "look at the screenshots: fix what looks wrong or feels clumsy."
    "Fix what looks wrong or feels clumsy": "look at the screenshots: fix what looks wrong or feels clumsy."
  standard.design: &web-design  # the Design stage's directions; the rest is its extra
    "Make round 1 of its design pass": "Make a round of the project's design pass (skills/design.md): the doc, with directions for Riggy to pick from, built on his words in `docs/brief.md` and what the project is now."
  standard.guide: &web-guide
    "Don't restyle the app yet": "Don't restyle the app yet."
  standard.apply: &web-apply
    "Restyle the MVP from": "Restyle the whole app from `docs/design.md` and its assets (skills/design.md): tokens and fonts first, then every component, screen and state, the icons and manifest."
    "Keep tests passing.": "Keep tests passing, and add or update them for what changed."
  standard.buildout: &buildout  # Build's rest part; his reply, in what it's about
    "Riggy has tried the MVP.": "Riggy tried it, and his reply is under \"Riggy's feedback\""
    "His reply is under": "Riggy tried it, and his reply is under \"Riggy's feedback\""
    "If he asked for changes, make those first": "If Riggy asked for changes (under \"Riggy's feedback\"), make those first, ahead of the rest of the plan."
    "Update the spec if his feedback changed it.": "Update the plan if his feedback changed it."
    "Build out the rest of the spec's": "Build out the rest of the plan: the spec's \"after the MVP\" list that's worth doing, with tests for core paths."
  standard.review: &web-review  # the spec and the guide, in what it's held to
    "Review it with skills/review.md, against": "Review it with skills/review.md against what it says to hold it to and `AGENTS.md` only"
    "Fix what you find.": "Fix what you find, one commit per fix"
  standard.docs: &web-docs
    "It's what he reads when golem tells him the project is done.": "It's what he reads when golem tells him it's done."
  rigorous.spec:  # Plan's thorough care
    "Turn the request into a thorough spec.": "Research what makes this kind of thing good"
    "Write the findings that matter into the spec.": "Write the findings that matter into the plan"
    "Write `docs/specs/mvp.md` with skills/spec-writing.md": "with a concrete bar for \"good\": the details that make it delightful."
  rigorous.spec-review:  # Review's plan part
    "You are a fresh pair of eyes on `docs/specs/mvp.md`": "You are a fresh pair of eyes on the plan this step is about (below), with only `docs/brief.md` for context."
    "Check it against Riggy's request": "Check it against Riggy's request: does it deliver what he asked for, is anything important missing, is anything there he didn't want, is the quality bar specific enough to build against, is each later item small enough to build in one go?"
    "Edit the spec to fix what you find": "If you change the plan, note the significant changes at the end of it under \"Review notes\"."
    "Message: the most important change you made.": "Message: the most important thing you fixed."
  rigorous.scaffold:  # Build's thorough care; bin/test, which CI runs
    "Follow skills/new-repo.md: app skeleton, test setup": "Test thoroughly: unit tests for the logic, and browser tests (Playwright) for the main and changed flows, running in CI."
  rigorous.mvp:
    <<: *mvp
    "Build the MVP with thorough tests": "Test thoroughly: unit tests for the logic, and browser tests (Playwright) for the main and changed flows, running in CI."
    "Look at the screenshots and hold them": "Hold the screenshots to the quality bar, and the spec's if there is one."
    "Smoke test the production build locally": "Smoke test the production build locally: build it, serve it, and run the main flow in the browser."
  rigorous.design: *web-design
  rigorous.guide: *web-guide
  rigorous.apply: *web-apply
  rigorous.buildout:  # and its extra
    <<: *buildout
    "Build out the spec's \"after the MVP\" list, with thorough tests.": "Build out the whole \"after the MVP\" list."
    "Polish: go through every screen": "In the polish, check keyboard and touch use and accessibility basics too."
  rigorous.review:
    <<: *web-review
    "Be demanding: compare it to the spec's quality bar.": "Be demanding: compare it to the quality bar, and the spec's if there is one."
  rigorous.second-pass:  # Review's fixes part, and its extra
    "A second review, of the first review's fixes": "A second review, of the last review's fixes (below)"
    "Are they right, complete and tested": "are they right, complete and tested, and did they break anything else?"
    "Then use the whole app once more": "This is a new project, so use the whole app once more, as a first-time visitor would."
    "Fix what you find.": "Fix what you find, one commit per fix"
  rigorous.docs:
    <<: *web-docs
    "Add lessons that apply to every project": "Add lessons that apply to every project (a deploy gotcha, a CI trick) to the golem lessons file."
    # A report about golem, which golem's triage reads, in place of a file in a directory nothing read.
    "If a workflow or skill step was wrong or missing": "If a workflow, skill or prompt golem gave you was wrong or missed a step, report it (`golem report instructions ...`) with the edit you'd propose in its detail."
  reckless.build:  # Build's everything part, then how, with quick care
    "Tests are optional": "Keep tests light: the image build is the only required check."
    "Build the whole thing.": "Build the whole thing in one pass"
    "Check it in a real browser (skills/browser.md) at phone size": "fix what's broken or ugly in the browser at phone size."
    "It's what he reads when golem tells him the project is done.": "It's what he reads when golem tells him it's done."
dropped:
  feature.review:
    "You are a fresh pair of eyes on everything on this branch that isn't on `main` yet.": >-
      What it's about (below) gives the range instead: the work since the job began.
  feature.second-pass:
    "`git log origin/main..HEAD`": What it's about (below) gives the first review's fixes as an exact range.
  design.review:
    "You are a fresh pair of eyes on everything on this branch that isn't on `main` yet.": >-
      What it's about (below) gives the range instead: the work since the job began.
  design.second-pass:
    "`git log origin/main..HEAD`": What it's about (below) gives the first review's fixes as an exact range.
  options.review:
    "You are a fresh pair of eyes on everything on this branch that isn't on `main` yet.": >-
      What it's about (below) gives the range instead: the work since the job began.
  options.second-pass:
    "`git log origin/main..HEAD`": What it's about (below) gives the first review's fixes as an exact range.
  standard.review: &web-fresh
    "You are a fresh pair of eyes on everything on this branch that isn't on `main` yet.": >-
      What it's about (below) gives the range instead: the work since the job last shipped.
  rigorous.review: *web-fresh
  rigorous.second-pass:
    "`git log origin/main..HEAD`": What it's about (below) gives the first review's fixes as an exact range.
  standard.apply: &web-next
    "The buildout comes next and follows the guide.": >-
      The intro already says anything visible follows `docs/design.md` from the design pass on, and
      a restyle builds nothing new.
  rigorous.apply: *web-next
  standard.docs: &web-last
    "The last step before this ships.": What it covers is said instead, under what the step is about.
  rigorous.docs: *web-last
